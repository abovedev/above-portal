databases:
  - name: above-portal-db
    databaseName: above_portal
    user: above_portal

services:
  - type: web
    name: above-portal-api
    runtime: node
    plan: starter
    buildCommand: cd server && npm install && npm run db:generate && npm run build
    startCommand: cd server && npm run db:push && npm run start
    healthCheckPath: /api/health
    disk:
      name: above-portal-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: above-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://above-portal.onrender.com
      - key: UPLOAD_DIR
        value: /opt/render/project/src/server/uploads
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://above-portal-api.onrender.com/api/google/callback
      - key: ASANA_CLIENT_ID
        sync: false
      - key: ASANA_CLIENT_SECRET
        sync: false
      - key: ASANA_REDIRECT_URI
        value: https://above-portal-api.onrender.com/api/asana/callback

  - type: web
    name: above-portal
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://above-portal-api.onrender.com/api
